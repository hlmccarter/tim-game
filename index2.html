<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roast Tim: The Board Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); color: #fff; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s infinite; }
        @keyframes shimmer { 0%,100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(30deg); } }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 2rem; font-style: italic; }
        .scoreboard { display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
        .player { background: rgba(255,255,255,0.05); border: 2px solid #333; border-radius: 1rem; padding: 1rem 1.5rem; text-align: center; min-width: 140px; transition: all 0.3s; }
        .player.active { border-color: #feca57; box-shadow: 0 0 20px rgba(254,202,87,0.3); transform: scale(1.05); }
        .player .name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .player .score { font-size: 2rem; font-weight: 800; color: #48dbfb; }
        .board { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .tile { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1.5rem; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
        .tile:hover { transform: translateY(-4px); border-color: #feca57; box-shadow: 0 10px 30px rgba(254,202,87,0.2); }
        .tile .points { position: absolute; top: 0.75rem; right: 0.75rem; background: linear-gradient(135deg, #ff6b6b, #ee5a24); padding: 0.25rem 0.6rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 700; }
        .tile .emoji { font-size: 2.5rem; margin-bottom: 0.5rem; display: block; }
        .tile .text { font-size: 0.95rem; color: #ddd; line-height: 1.4; }
        .tile.selected { pointer-events: none; opacity: 0.4; border-color: #333; transform: none; }
        .turn-banner { text-align: center; font-size: 1.3rem; margin-bottom: 1.5rem; padding: 1rem; background: rgba(254,202,87,0.1); border-radius: 1rem; border: 1px solid rgba(254,202,87,0.3); }
        .turn-banner span { color: #feca57; font-weight: 700; }
        .animation-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; flex-direction: column; gap: 1rem; }
        .animation-overlay.show { opacity: 1; pointer-events: auto; }
        .animation-overlay .scene { font-size: 5rem; animation: bounce 0.6s ease infinite; }
        .animation-overlay .caption { font-size: 1.5rem; color: #feca57; text-align: center; max-width: 500px; }
        .animation-overlay .pts { font-size: 2rem; color: #48dbfb; font-weight: 800; animation: pop 0.5s ease; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pop { 0% { transform: scale(0); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .winner-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.9); z-index: 200; }
        .winner-screen h2 { font-size: 3rem; color: #feca57; animation: bounce 1s infinite; }
        .winner-screen .confetti { position: absolute; font-size: 2rem; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-100vh) rotate(0deg); } 100% { transform: translateY(100vh) rotate(720deg); } }
        .restart { margin-top: 2rem; padding: 1rem 2rem; font-size: 1.2rem; border: none; border-radius: 1rem; background: linear-gradient(135deg, #667eea, #764ba2); color: white; cursor: pointer; font-weight: 700; }
        .restart:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Roast Tim: The Board Game</h1>
        <p class="subtitle">The Coast Guard's finest... at being ridiculous</p>
        <div class="scoreboard" id="scoreboard"></div>
        <div class="turn-banner" id="turnBanner"></div>
        <div class="board" id="board"></div>
    </div>
    <div class="animation-overlay" id="overlay">
        <div class="scene" id="scene"></div>
        <div class="caption" id="caption"></div>
        <div class="pts" id="pts"></div>
    </div>
    <div class="winner-screen" id="winnerScreen" style="display:none">
        <h2 id="winnerText"></h2>
        <button class="restart" onclick="location.reload()">Play Again</button>
    </div>
    <script>
        const players = [{name:'Kevin',score:0},{name:'Lars',score:0},{name:'Aaron',score:0}];
        let currentPlayer = 0;
        const tiles = [
            {emoji:'🚢',text:'Tim salutes a seagull thinking it\'s his commanding officer',points:15,anim:'🫡🐦'},
            {emoji:'💪',text:'Tim flexes in the mirror but his reflection looks confused',points:10,anim:'💪🪞😕'},
            {emoji:'🌊',text:'Tim falls off the dock during a "routine inspection"',points:20,anim:'🏊‍♂️💦😂'},
            {emoji:'📣',text:'Tim uses a megaphone to order lunch at Subway',points:15,anim:'📣🥪'},
            {emoji:'🎖️',text:'Tim wears his Coast Guard uniform to a pool party',points:10,anim:'👔🏖️'},
            {emoji:'🚨',text:'Tim reports a rubber duck as a suspicious vessel',points:25,anim:'🦆🚨📋'},
            {emoji:'💃',text:'Tim does the macarena during emergency drills',points:20,anim:'💃🚨🕺'},
            {emoji:'🗣️',text:'Tim narrates his own life in third person at the grocery store',points:15,anim:'🛒🗣️😳'},
            {emoji:'⚓',text:'Tim gets his anchor tattoo on the wrong arm... twice',points:20,anim:'⚓😬⚓'},
            {emoji:'🦺',text:'Tim wears a life jacket to bed "just in case"',points:10,anim:'🛏️🦺😴'},
            {emoji:'📱',text:'Tim sends "10-4 copy that" in the family group chat',points:15,anim:'📱👨‍👩‍👧‍👦🤦'},
            {emoji:'🏃',text:'Tim runs in slow motion on the beach like Baywatch... alone',points:25,anim:'🏃‍♂️🏖️🎬'},
            {emoji:'🔭',text:'Tim uses binoculars to watch his neighbor mow the lawn',points:15,anim:'🔭🏡😐'},
            {emoji:'🎤',text:'Tim sings the national anthem before eating breakfast',points:20,anim:'🎤🥞🇺🇸'},
            {emoji:'🧭',text:'Tim uses a compass to find the bathroom at home',points:10,anim:'🧭🚽🏠'},
            {emoji:'🐟',text:'Tim tries to arrest a fish for "swimming without a license"',points:25,anim:'🐟👮‍♂️📝'},
        ];
        let available = tiles.map((_,i) => i);

        function render() {
            document.getElementById('scoreboard').innerHTML = players.map((p,i) =>
                `<div class="player ${i===currentPlayer?'active':''}"><div class="name">${p.name}</div><div class="score">${p.score}</div></div>`
            ).join('');
            document.getElementById('turnBanner').innerHTML = `<span>${players[currentPlayer].name}</span>'s turn — pick something dumb Tim would do!`;
            document.getElementById('board').innerHTML = available.map(i => {
                const t = tiles[i];
                return `<div class="tile" onclick="pick(${i})"><span class="points">+${t.points} pts</span><span class="emoji">${t.emoji}</span><span class="text">${t.text}</span></div>`;
            }).join('');
        }

        function pick(i) {
            const t = tiles[i];
            players[currentPlayer].score += t.points;
            available = available.filter(x => x !== i);
            // Show animation
            const overlay = document.getElementById('overlay');
            document.getElementById('scene').textContent = t.anim;
            document.getElementById('caption').textContent = t.text;
            document.getElementById('pts').textContent = `+${t.points} points for ${players[currentPlayer].name}!`;
            overlay.classList.add('show');
            setTimeout(() => {
                overlay.classList.remove('show');
                if (players[currentPlayer].score >= 100) return showWinner();
                currentPlayer = (currentPlayer + 1) % 3;
                if (available.length === 0) return showWinner();
                render();
            }, 2500);
        }

        function showWinner() {
            const winner = players.reduce((a,b) => a.score > b.score ? a : b);
            const ws = document.getElementById('winnerScreen');
            ws.style.display = 'flex';
            document.getElementById('winnerText').textContent = `🏆 ${winner.name} wins with ${winner.score} points!`;
            const emojis = ['🎉','🎊','⭐','🌟','🏆','😂','🤣'];
            for (let i = 0; i < 30; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                c.style.left = Math.random()*100+'%';
                c.style.animationDuration = (2+Math.random()*3)+'s';
                c.style.animationDelay = Math.random()*2+'s';
                ws.appendChild(c);
            }
        }

        render();
    </script>
</body>
</html>
